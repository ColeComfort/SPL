<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>SPL Online</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      :root { --maxw: 980px }
      body{max-width:var(--maxw);margin:24px auto;font-family:system-ui,Arial,sans-serif}
      textarea{width:100%;height:260px}
      pre{white-space:pre-wrap;border:1px solid #ccc;padding:12px;min-height:160px}
      button{padding:8px 16px}
      input[type=number]{width:7em;padding:6px}
      .row{display:flex;gap:12px;align-items:center;margin:8px 0;flex-wrap:wrap}
      .muted{opacity:.7;font-size:.9em}
      .spacer{flex:1}
      #toast{position:fixed;right:16px;bottom:16px;padding:10px 12px;border:1px solid #ccc;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15);display:none}
      label{display:inline-flex;align-items:center;gap:6px}
      #status{margin-left:8px}
      button[disabled]{opacity:.55; cursor:not-allowed}
    </style>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.3/full/pyodide.js"></script>
  </head>
  <body>
    <h1>SPL Online</h1>

    <div class="row">
      <label>Prime p: <input id="odd prime" type="number" value="3" min="3" step="1" /></label>
      <button id="run" disabled>Run</button>
      <button id="load-teleport" disabled>Load teleportation</button>
      <span id="status" class="muted">booting…</span>
      <span class="spacer"></span>
      <span id="version" class="muted"></span>
    </div>

    <textarea id="src" spellcheck="false" placeholder="Write SPL here or click ‘Load teleportation’."></textarea>

    <h3>Output</h3>
    <pre id="out" aria-live="polite"></pre>

    <div id="toast" role="status" aria-live="assertive"></div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
