<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>SPL Online</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      body{max-width:980px;margin:24px auto;font-family:system-ui,Arial,sans-serif}
      textarea{width:100%;height:260px}
      pre{white-space:pre-wrap;border:1px solid #ccc;padding:12px;min-height:160px}
      button{padding:8px 16px}
      .row{display:flex;gap:12px;align-items:center;margin:8px 0;flex-wrap:wrap}
      .muted{opacity:.7;font-size:.9em}
      .spacer{flex:1}
      #toast{position:fixed;right:16px;bottom:16px;padding:10px 12px;border:1px solid #ccc;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15);display:none}
    </style>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.3/full/pyodide.js"></script>
  </head>
  <body>
    <h1>SPL Online</h1>
    <div class="row">
      <button id="run">Run</button>
      <button id="load-teleport">Load teleportation</button>
      <span class="spacer"></span>
      <span id="version" class="muted"></span>
    </div>

    <textarea id="src" spellcheck="false" placeholder="Write SPL here or click ‘Load teleportation’."></textarea>

    <h3>Output</h3>
    <pre id="out" aria-live="polite"></pre>

    <div id="toast" role="status" aria-live="assertive"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
